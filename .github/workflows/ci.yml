name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Backend: Go build and test
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - run: go mod download
      - run: go build -v ./...
      - run: go test -v ./... || true

  # ---------------------------------------------------------------------------
  # Frontend: Node build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  # NOTE: Cloud Run 部署已移除（改為自架伺服器部署，見 deploy-server.yml）。
  # 原本的 GCP 服務帳號金鑰已失效，且所有服務改走自架，故停用雲端部署。
