name: CI / Deploy to Cloud Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-east1
  SERVICE: paw-diary
  IMAGE: asia-east1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/paw-diary/paw-diary

jobs:
  # ---------------------------------------------------------------------------
  # Backend: Go build and test
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - run: go mod download
      - run: go build -v ./...
      - run: go test -v ./... || true

  # ---------------------------------------------------------------------------
  # Frontend: Node build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  # ---------------------------------------------------------------------------
  # Deploy: 只有 push to main 才跑（PR 不部署）
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --memory 2Gi \
            --cpu 2 \
            --timeout 3600 \
            --set-env-vars "STORAGE_PATH=/tmp/storage" \
            --set-env-vars "AI_API_ENDPOINT=https://openrouter.ai/api/v1/chat/completions" \
            --set-env-vars "AI_MODEL_NAME=google/gemini-2.0-flash-001" \
            --set-env-vars "AI_VISION_MODEL=google/gemini-2.0-flash-001" \
            --set-env-vars "AI_TEXT_MODEL=openai/gpt-4o-mini" \
            --set-env-vars "ANALYSIS_DURATION_SECONDS=15" \
            --set-env-vars "ANALYSIS_INTERVAL=2" \
            --set-env-vars "SEGMENT_DURATION_SECONDS=3" \
            --set-env-vars "MAX_AI_IMAGES=10" \
            --update-secrets "AI_API_KEY=paw-diary-api-key:latest"
